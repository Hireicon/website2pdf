version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pagesnap_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pagesnap
      MYSQL_USER: pagesnap
      MYSQL_PASSWORD: pagesnap_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: pagesnap_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data:
